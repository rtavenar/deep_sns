name: Publier le livre

# À chaque push sur main :
#  1. construit le livre et le publie sur GitHub Pages ;
#  2. génère les notebooks Colab et les pousse sur la branche `notebooks`
#     (les boutons « Ouvrir dans Colab » du livre pointent vers cette branche).
on:
  push:
    branches: [main]
  workflow_dispatch:  # permet aussi de lancer la publication à la main

permissions:
  contents: write   # pour pousser la branche `notebooks`
  pages: write
  id-token: write

# Une seule publication à la fois ; une nouvelle remplace celle en cours
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          # version CPU de torch (bien plus légère que la version CUDA)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Construire le livre
        run: jupyter-book build .

      - name: Générer les notebooks pour Colab
        run: python scripts/make_notebooks.py _build/notebooks

      - name: Faire pointer les boutons Colab vers les notebooks
        run: |
          find _build/html -name '*.html' -exec sed -i -E \
            's#(colab\.research\.google\.com/github/[^/]+/[^/]+/blob/)main/(content/[A-Za-z0-9_-]+)\.md#\1notebooks/\2.ipynb#g' {} +

      - name: Pousser les notebooks sur la branche `notebooks`
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: notebooks
          publish_dir: ./_build/notebooks
          force_orphan: true
          enable_jekyll: true   # pas de fichier .nojekyll inutile
          commit_message: "Notebooks générés depuis"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
